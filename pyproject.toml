[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalimagens"
version = "0.1.0"
description = "Gerador determinístico de criativos para marketplace"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]
